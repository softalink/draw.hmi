name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  drawio:
    name: draw.io plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/dev/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache
          key: drawio-${{ hashFiles('upstream/drawio.json') }}
      - run: npm ci
      - run: npm ci
        working-directory: tools/dev
      - name: Unit tests
        run: npm test
      - name: Build the plugin and the webapp (pinned draw.io)
        run: npm run build:webapp
      - run: npx playwright install --with-deps chromium
      - name: Contract tests (draw.io API)
        run: npm run test:contract
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: draw.hmi
          path: dist/draw.hmi

  grafana:
    name: Grafana ${{ matrix.grafana }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grafana: ['12.1.1', '13.2.2']
        mode: [overlay, window]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            grafana/panel/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache
          key: drawio-${{ hashFiles('upstream/drawio.json') }}
      - run: npm ci
      - run: npm ci
        working-directory: grafana/panel
      - run: npm run typecheck && npm run lint && npm test
        working-directory: grafana
      - name: Build both plugins
        run: npm run build
        working-directory: grafana
      - name: Start Grafana
        working-directory: grafana
        env:
          GRAFANA_VERSION: ${{ matrix.grafana }}
          GF_SECURITY_ALLOW_EMBEDDING: ${{ matrix.mode == 'overlay' }}
        run: |
          docker compose up -d
          timeout 120 bash -c 'until curl -sf localhost:3000/api/health; do sleep 2; done'
      - run: npx playwright install --with-deps chromium
        working-directory: grafana/panel
      - name: End-to-end tests
        working-directory: grafana
        env:
          HMI_EDITOR_MODE: ${{ matrix.mode }}
        run: npm run e2e
      - if: failure()
        run: docker compose logs
        working-directory: grafana
      - if: matrix.grafana == '13.2.2' && matrix.mode == 'overlay'
        uses: actions/upload-artifact@v4
        with:
          name: grafana-plugins
          path: |
            grafana/panel/dist
            grafana/editor-app/dist
